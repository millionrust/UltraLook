name: UltraLook
options:
  bundleIdPrefix: com.millionrust
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  UltraLookKit:
    type: framework
    platform: macOS
    sources:
      - path: UltraLookKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.millionrust.ultralook.kit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  UltraLook:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Samples
      - path: App/Samples
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.millionrust.ultralook
        PRODUCT_NAME: "Ultra Look"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/UltraLook.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - target: UltraLookKit
        embed: true
      - target: UltraLookPreview
        embed: true
        codeSign: true

  UltraLookPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.millionrust.ultralook.preview
        PRODUCT_NAME: UltraLookPreview
        INFOPLIST_FILE: PreviewExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: PreviewExtension/UltraLookPreview.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - target: UltraLookKit
        embed: false
      - sdk: Quartz.framework

  UltraLookKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.millionrust.ultralook.kit.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: UltraLookKit

schemes:
  UltraLook:
    build:
      targets:
        UltraLook: all
        UltraLookKitTests: [test]
    test:
      targets:
        - UltraLookKitTests
